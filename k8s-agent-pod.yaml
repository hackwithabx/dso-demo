apiVersion: v1
kind: Pod
metadata:
  name: jenkins-agent
spec:
  serviceAccountName: jenkins
  containers:

    # ---------------------------
    # ✅ MAVEN CONTAINER
    # ---------------------------
    - name: maven
      image: maven:3.9.6-eclipse-temurin-17
      command:
        - cat
      tty: true

    # ---------------------------
    # ✅ DOCKER / KANIKO CONTAINER
    # ---------------------------
    - name: kaniko
      image: gcr.io/kaniko-project/executor:v1.6.0-debug
      imagePullPolicy: Always
      command:
        - sleep
      args:
        - "99d"
      volumeMounts:
        - name: jenkins-docker-cfg
          mountPath: /kaniko/.docker

    # ---------------------------
    # ✅ SAST SCAN CONTAINER (NEW)
    # ---------------------------
    - name: slscan
      image: shiftleft/sast-scan:v2.1.2
      imagePullPolicy: Always
      command:
        - cat
      tty: true

  # ---------------------------
  # ✅ DOCKER CONFIG SECRET
  # ---------------------------
  volumes:
    - name: jenkins-docker-cfg
      projected:
        sources:
          - secret:
              name: regcred
              items:
                - key: .dockerconfigjson
                  path: config.json
